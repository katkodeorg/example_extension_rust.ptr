name: Retired Repository

# This repository is retired. The workflow is intentionally a no-op so pushes
# do not rebuild or recommit the old extension binary.

on:
  workflow_dispatch: # allow manual re-runs from the Actions tab

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest

    steps:
      - name: Print retirement notice
        run: echo "This repository is retired. Use katkodeorg/pointiv-extension-starter-rust.ptr."
