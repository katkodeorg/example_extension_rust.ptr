name: Build WASM

# Automatically rebuild extension.wasm on every push to main/master
# and commit the updated binary back to the repo.
#
# This means users who install your extension from GitHub always get
# a binary that matches the source code in the same commit.

on:
  push:
    branches: [main, master]
  workflow_dispatch: # allow manual re-runs from the Actions tab

permissions:
  contents: write   # needed so the auto-commit step can push extension.wasm

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust + wasm32-wasip1 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      # Cache the Cargo registry and build artifacts to keep CI fast.
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --release --target wasm32-wasip1

      - name: Copy binary to repo root
        # WASM cdylib outputs do NOT get the "lib" prefix — output is {name}.wasm
        run: cp target/wasm32-wasip1/release/extension.wasm extension.wasm

      - name: Print SHA-256
        run: |
          echo "SHA-256: $(sha256sum extension.wasm | awk '{print $1}')"
          echo "Size: $(wc -c < extension.wasm) bytes"

      # Commit the freshly-built binary back to the branch.
      # The "[ci skip]" tag prevents an infinite build loop.
      - name: Commit updated extension.wasm
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "build: update extension.wasm [ci skip]"
          file_pattern: extension.wasm
