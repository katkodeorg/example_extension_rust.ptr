[package]
name        = "hello-world-extension"
version     = "1.0.0"
edition     = "2024"
description = "Sample Pointiv community extension (WASM/Rust)"

[lib]
name       = "extension"
crate-type = ["cdylib"]

[profile.release]
opt-level     = "s"
lto           = true
codegen-units = 1
strip         = "symbols"
panic         = "abort"

[dependencies]
extism-pdk = "1.4.1"
pointiv-extension-api = "0.1.0"
